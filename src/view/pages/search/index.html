<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Google Results Inside Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #searchResults {
            margin-top: 20px;
        }
        .result {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .result a {
            text-decoration: none;
            color: #1a0dab;
        }
        .result a:hover {
            text-decoration: underline;
        }
        .result .title {
            font-weight: bold;
        }
        .result .url {
            color: #006621;
        }
        .result .snippet {
            color: #545454;
        }
    </style>
</head>
<body>

    <h1>Search Google Results Inside Your Page</h1>

    <!-- Search Form -->
    <input type="text" id="searchQuery" placeholder="Enter your search term" />
    <button onclick="performSearch()">Search</button>

    <div id="searchResults"></div>

    <!-- Google CSE Script -->
    <script async src="https://cse.google.com/cse.js?cx=YOUR_CUSTOM_SEARCH_ENGINE_ID"></script>
    
    <script>
        function performSearch() {
            const query = document.getElementById('searchQuery').value;
            if (!query) return; // If query is empty, do nothing

            // Clear previous search results
            document.getElementById('searchResults').innerHTML = 'Searching...';

            // Google CSE search
            const cx = 'YOUR_CUSTOM_SEARCH_ENGINE_ID'; // Your CSE ID
            const apiKey = 'YOUR_GOOGLE_API_KEY'; // Your API Key

            // Make the request to the Google Custom Search API
            const url = `https://www.googleapis.com/customsearch/v1?q=${query}&cx=${cx}&key=${apiKey}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const resultsContainer = document.getElementById('searchResults');
                    if (data.items) {
                        resultsContainer.innerHTML = ''; // Clear loading message
                        data.items.forEach(item => {
                            const resultDiv = document.createElement('div');
                            resultDiv.classList.add('result');

                            // Title
                            const title = document.createElement('a');
                            title.classList.add('title');
                            title.href = item.link;
                            title.target = '_blank';
                            title.textContent = item.title;
                            resultDiv.appendChild(title);

                            // URL
                            const url = document.createElement('div');
                            url.classList.add('url');
                            url.textContent = item.link;
                            resultDiv.appendChild(url);

                            // Snippet
                            const snippet = document.createElement('div');
                            snippet.classList.add('snippet');
                            snippet.textContent = item.snippet;
                            resultDiv.appendChild(snippet);

                            resultsContainer.appendChild(resultDiv);
                        });
                    } else {
                        resultsContainer.innerHTML = 'No results found.';
                    }
                })
                .catch(err => {
                    console.error('Error fetching data: ', err);
                    document.getElementById('searchResults').innerHTML = 'An error occurred while fetching search results.';
                });
        }
    </script>

</body>
</html>
