   <body>
      <!-- loader Start -->
      <div id="loading">
         <div id="loading-center">
         </div>
      </div>
      <!-- loader END -->
      <!-- Wrapper Start -->
      <div class="wrapper">
         <!-- SIDE Nav Bar  -->
         <div id="side-navbar"></div>
         <!-- TOP Nav Bar -->
         <div id="top-navbar"></div>
         
         <!-- Page Content  -->
         <div id="content-page" class="content-page">
            <div class="modal fade" id="primaryUserModal" tabindex="-1" role="dialog" aria-labelledby="primaryUserModalTitle" aria-hidden="true"></div>
            <div class="container-fluid">
               <div class="row">
                   <div class="iq-card-body">
                       <nav aria-label="breadcrumb">
                          <ol class="breadcrumb bg-primary mb-0">
                             <li class="breadcrumb-item"><a href="../home/" class="text-white"><i class="ri-home-4-line mr-1 float-left"></i>Home</a></li>
                             <li class="breadcrumb-item active text-white" aria-current="page">Budget Manager</li>
                          </ol>
                       </nav>
                    </div>
               </div>
               <hr></hr>
               <div class="row">
                  <div class="col-sm-6 col-md-6 col-lg-4">
                     <div class="iq-card iq-card-block iq-card-stretch iq-card-height">
                        <div class="iq-card-body iq-box-relative">
                           <div class="iq-box-absolute icon iq-icon-box rounded-circle iq-bg-primary">
                              <i class="ri-focus-2-line"></i>
                           </div>
                           <p class="text-secondary">Total Budget</p>
                           <div class="d-flex align-items-center justify-content-between">
                              <h4><b id="total-budget-val"></b></h4>
                              <span id="budget-percent"></span>
                           </div>
                        </div>
                     </div>
                  </div>
                  <div class="col-sm-6 col-md-6 col-lg-4">
                     <div class="iq-card iq-card-block iq-card-stretch iq-card-height">
                        <div class="iq-card-body iq-box-relative">
                           <div class="iq-box-absolute icon iq-icon-box rounded-circle iq-bg-danger">
                              <i class="ri-pantone-line"></i>
                           </div>
                           <p class="text-secondary">Current Spendings</p>
                           <div class="d-flex align-items-center justify-content-between">
                              <h4><b id="total-spendings-val"></b></h4>
                              <span id="spendings-percent"></span>
                           </div>
                        </div>
                     </div>
                  </div>
                  <div class="col-sm-6 col-md-6 col-lg-4">
                     <div class="iq-card iq-card-block iq-card-stretch iq-card-height">
                        <div class="iq-card-body iq-box-relative">
                           <div class="iq-box-absolute icon iq-icon-box rounded-circle iq-bg-success">
                              <i class="ri-database-2-line"></i>
                           </div>
                           <p class="text-secondary">Remaining Budget</p>
                           <div class="d-flex align-items-center justify-content-between">
                              <h4><b id="total-remaining-val"></b></h4>
                              <span id="remaining-percent"></span>
                           </div>
                        </div>
                     </div>
                  </div>
               </div>
               <hr></hr>
               <div class="row">
                  <!--TOP TILEs-->
                  <div class="row mx-2" id="budget-tiles-container"></div>
