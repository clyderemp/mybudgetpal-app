<div class="modal-dialog modal-xl modal-dialog-scrollable" role="document">
   <div class="modal-content">
      <div class="modal-header">
         <h5 class="modal-title" id="exampleModalScrollableTitle">Invoice Table</h5>
         <button type="button" class="close" data-dismiss="modal" aria-label="Close">
         <span aria-hidden="true">&times;</span>
         </button>
      </div>
      <div class="modal-body">
         <p>You can view your up-to-date invoices here!</p>
         <div class="table-responsive">
            <table class="table mb-0">
               <thead class="thead-light">
                  <tr>
                     <th scope="col">Date</th>
                     <th scope="col">Type</th>
                     <th scope="col">Category</th>
                     <th scope="col">Amount</th>
                     <th scope="col">Recipient</th>
                     <th scope="col">Added by</th>
                  </tr>
               </thead>
               <tbody id="full-invoice-table">
               </tbody>
            </table>
         </div>
      </div>
   </div>
</div>

<!-- Include JS for form handling -->
<script type="module" src="../../../presenter/APIs/invoiceTable.js"></script>
