<div class="modal-dialog modal-xl modal-dialog-scrollable" role="document">
   <div class="modal-content">
      <div class="modal-header">
         <h5 class="modal-title">Budget Plan</h5>
         <button type="button" class="close" data-dismiss="modal" aria-label="Close">
         <span aria-hidden="true">&times;</span>
         </button>
      </div>
      <div class="modal-body">
         <p>You can plan your monthly budget here based on your scheduled salary.</p>
         <form id="budgetPlanForm" class="needs-validation" novalidate>
            <div class="form-row">
               <div class="col-md-12 mb-4 input-group" id="usersSalaryInput"></div>
            </div>
            <div class="form-row">
               <div class="col-md-12 mb-4 input-group" id="categoryPercentInput"></div>
            </div>
            <div class="form-row">
               <div class="col-md-12 mb-4 input-group" id="budgetTableInput"></div>
            </div>
            <div class="modal-footer align-self-center">
               <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
               <button type="submit" class="btn btn-primary">Save changes</button>
            </div>
         </form>
      </div>
   </div>
</div>

<!-- Include JS for form handling -->
<script type="module" src="../../../presenter/APIs/budgetPlanForm.js"></script>
